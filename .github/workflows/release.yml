name: Release

# 打 v* 标签时构建正式签名的 APK 并创建 GitHub Release。
# App 内更新通过公开的 Release API 读取最新版本与下载地址，
# 因此本仓库必须保持公开，且 Release 不能标记为 draft。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（如 v1.0.4），需已存在且尚未发布'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # 证书指纹是公开校验值；更换正式签名密钥时必须同步更新。
  EXPECTED_SIGNING_CERT_SHA256: 8ca36540c217e9f9fdbbd76787706f85922791e9653808da561cc960486e7f0d

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: 校验发布标签
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::标签必须符合 vX.Y.Z 格式，实际为 $RELEASE_TAG。"
            exit 1
          fi

          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::$RELEASE_TAG 不是已存在的 Git 标签。"
            exit 1
          fi

          TAG_COMMIT=$(git rev-list -n 1 "$RELEASE_TAG")
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [[ "$TAG_COMMIT" != "$HEAD_COMMIT" ]]; then
            echo "::error::当前检出的提交与标签 $RELEASE_TAG 不一致。"
            exit 1
          fi

          PUBSPEC_VER=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+)(\+.*)?$/\1/p' pubspec.yaml)
          if [[ -z "$PUBSPEC_VER" || "${RELEASE_TAG#v}" != "$PUBSPEC_VER" ]]; then
            echo "::error::标签 $RELEASE_TAG 与 pubspec.yaml 的 version (${PUBSPEC_VER:-无法解析}) 不一致。"
            exit 1
          fi

          HTTP_STATUS=$(curl --silent --show-error \
            --output "$RUNNER_TEMP/existing-release.json" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          case "$HTTP_STATUS" in
            200)
              echo "::error::Release $RELEASE_TAG 已存在；为保证同一版本的 APK 不可变，本工作流拒绝覆盖。"
              exit 1
              ;;
            404) ;;
            *)
              echo "::error::检查现有 Release 失败，GitHub API 返回 HTTP $HTTP_STATUS。"
              exit 1
              ;;
          esac

          echo "标签、提交和版本一致：$RELEASE_TAG ($HEAD_COMMIT)"

      - name: 生成变更日志
        run: |
          PREV=$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)
          {
            if [[ -n "$PREV" ]]; then
              echo "## 自 $PREV 以来的变更"
              echo
              git log --no-merges --pretty='- %s' "$PREV..$RELEASE_TAG"
            else
              echo '## 首个发布版本'
            fi
            echo
            echo '---'
            echo 'arm64-v8a 适用于绝大多数设备；不确定时下载 `app-release.apk`（通用包，体积较大）。'
          } > release-notes.md

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

      - name: 还原签名配置
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          MISSING=()
          [[ -n "$KEYSTORE_B64" ]] || MISSING+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$STORE_PASSWORD" ]] || MISSING+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$KEY_PASSWORD" ]] || MISSING+=(ANDROID_KEY_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || MISSING+=(ANDROID_KEY_ALIAS)
          if (( ${#MISSING[@]} > 0 )); then
            echo "::error::缺少 Android 发布签名 Secret：${MISSING[*]}。"
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: 构建 APK
        run: |
          mkdir -p build/debug-info
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --obfuscate --split-debug-info=build/debug-info --no-pub
          flutter build apk --release \
            --obfuscate --split-debug-info=build/debug-info --no-pub

      - name: 校验所有发布 APK 的签名
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 \
            -type f -name apksigner -print | sort -V | tail -n 1)
          if [[ -z "$APKSIGNER" ]]; then
            echo '::error::未找到 Android SDK apksigner。'
            exit 1
          fi

          APKS=(
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          )
          for APK in "${APKS[@]}"; do
            if [[ ! -f "$APK" ]]; then
              echo "::error::缺少待发布产物 $APK。"
              exit 1
            fi

            CERTS=$("$APKSIGNER" verify --print-certs "$APK")
            printf '%s\n' "$CERTS"
            mapfile -t DIGESTS < <(printf '%s\n' "$CERTS" | sed -n \
              's/^.*certificate SHA-256 digest: //p')
            if (( ${#DIGESTS[@]} == 0 )); then
              echo "::error::未能从 $APK 读取签名证书指纹。"
              exit 1
            fi
            for DIGEST in "${DIGESTS[@]}"; do
              if [[ "${DIGEST,,}" != "$EXPECTED_SIGNING_CERT_SHA256" ]]; then
                echo "::error::$APK 包含非预期的签名证书指纹。"
                exit 1
              fi
            done
          done

      - name: 清理签名材料
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks"

      - name: 整理发布产物
        run: |
          mkdir -p release-dist
          cp build/app/outputs/flutter-apk/app-release.apk release-dist/
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-dist/
          cp release-notes.md release-dist/

      - name: 暂存发布产物
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release-dist/
          if-no-files-found: error

      - name: 暂存混淆符号
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: debug-info-${{ env.RELEASE_TAG }}
          path: build/debug-info/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 下载发布产物
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: release-dist

      - name: 核对发布产物
        run: |
          for FILE in \
            release-dist/app-release.apk \
            release-dist/app-arm64-v8a-release.apk \
            release-dist/release-notes.md; do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::缺少发布文件 $FILE。"
              exit 1
            fi
          done

      - name: 创建不可覆盖的 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-dist/app-release.apk \
            release-dist/app-arm64-v8a-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes-file release-dist/release-notes.md \
            --verify-tag
