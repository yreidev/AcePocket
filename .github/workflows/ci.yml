name: CI

# 每次推送与 PR 都跑格式、静态检查、测试与 Android 构建校验。
# 构建使用公开的 debug 密钥签名，不产出可分发产物，
# 发布流程见 release.yml。
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: dart format
        run: dart format --output=none --set-exit-if-changed lib test

      # 本项目要求 0 error 0 warning 0 info（含 info 级废弃提示），
      # 因此不加任何 --no-fatal-* 放宽。
      - name: flutter analyze
        run: flutter analyze --no-pub

      - name: flutter test
        run: flutter test --no-pub

      # 用 debug 密钥构建，仅验证 release 构建链路可用，产物不分发。
      - name: 构建校验（debug 签名）
        run: flutter build apk --release --target-platform android-arm64 --no-pub
