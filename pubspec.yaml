name: acepocket
description: AcePocket —— AcePanel 服务器面板的非官方 Android 客户端
publish_to: "none"
version: 1.2.0+7

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  dio: ^5.7.0
  crypto: ^3.0.5
  # 先经过 v10 完成 encryptedSharedPreferences -> 自定义加密存储迁移。
  flutter_secure_storage: ^10.1.0
  shared_preferences: ^2.3.2
  web_socket_channel: ^3.0.1
  fl_chart: ^1.2.0
  xterm: ^4.0.0
  intl: ^0.20.2
  file_picker: ^12.0.0
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
