publish_to: "none"
version: 1.2.0+7

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.7.0
  crypto: ^3.0.5
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  web_socket_channel: ^3.0.1
  fl_chart: ^0.69.0
  xterm: ^4.0.0
  intl: ^0.20.2
  file_picker: ^11.0.2
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
